[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragi-toolkit"
version = "1.0.0"
description = "ragi — Retrieval that rises. Eval-first, agent-agnostic RAG toolkit -- define, measure, iterate, ship as a portable retrieval contract (Python lib / MCP server) any agent consumes."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Hedy Pamungkas", email = "hedypamungkas@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
keywords = ["rag", "retrieval", "evaluation", "mcp", "search", "embeddings", "bm25", "agent-agnostic"]
dependencies = [
    "httpx>=0.25",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# v0.1
parsers = ["pypdf>=4.0", "python-docx>=1.1", "pdfplumber>=0.11"]
indo-nlp = ["Sastrawi>=1.0.1"]
eval = ["datasets>=2.14"]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "build>=1.2",
]
# v0.2+ (declared now, exercised in later slices)
rerank-local = ["sentence-transformers>=2.7"]
vector-faiss = ["faiss-cpu>=1.7"]
mcp = ["mcp>=1.0"]
adapters-langchain = ["langchain-core>=0.2"]
adapters-llamaindex = ["llama-index>=0.10"]
# v0.5
rag-cloud = ["boto3>=1.34"]
vectorstore-chroma = ["chromadb>=0.5"]
vectorstore-pgvector = ["psycopg[binary]>=3.1"]

[project.scripts]
ragi = "ragi.workbench.cli:main"

[project.urls]
Homepage = "https://github.com/hedypamungkas/ragi"
Documentation = "https://github.com/hedypamungkas/ragi#readme"
Repository = "https://github.com/hedypamungkas/ragi"
Issues = "https://github.com/hedypamungkas/ragi/issues"
Changelog = "https://github.com/hedypamungkas/ragi/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ASYNC", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=ragi --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
  "*/__init__.py",
  # Import-gated optional backends -- their deps (faiss/chroma/psycopg) are absent in CI,
  # so these files have no executable branches there. They're import-gated + documented;
  # the VectorStore Protocol + memory impl (fully tested) prove the contract.
  "src/ragi/vectorstore/faiss.py",
  "src/ragi/vectorstore/chroma.py",
  "src/ragi/vectorstore/pgvector.py",
  "src/ragi/adapters/llamaindex.py",
]

[tool.coverage.report]
# Ratcheting floor: post-omit (import-gated backends excluded) the suite covers ~64%. Set
# below-current with a buffer so CI stays green; ratchet UP as tests grow (target ~80% over
# v1.x). Do NOT raise above the measured level or CI goes red.
fail_under = 60
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
# Advisory in CI (continue-on-error) -- Protocol-heavy + TYPE_CHECKING code. Lenient config keeps
# it useful without fighting noise; promote to a HARD gate once the type-clean backlog burns down.
python_version = "3.10"
ignore_missing_imports = true  # optional deps (faiss/chroma/psycopg/boto3/mcp/langchain) absent
no_strict_optional = true
files = ["src/ragi"]

[tool.bandit]
exclude_dirs = ["tests", "data", "scripts"]
skips = [
  "B608",  # pgvector SQL is parameterized (%s via psycopg) -- heuristic false positive.
]
