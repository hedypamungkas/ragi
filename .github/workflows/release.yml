name: Release (build-only)

# Build sdist + wheel on a `v*` tag. PyPI PUBLISH IS INTENTIONALLY DEFERRED -- ragi
# is not on PyPI yet. When cutting a real release, add a `publish` job:
#   needs: build, permissions: {id-token: write}, environment: pypi,
#   uses: pypa/gh-action-pypi-publish@release/v1 with attestations: true  (OIDC trusted publishing)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
