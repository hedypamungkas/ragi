name: Release

# Build sdist + wheel on a `v*` tag, then publish to PyPI via OIDC trusted
# publishing (no long-lived API token). ONE-TIME PyPI-side prerequisite: register
# this repo as a trusted publisher at https://pypi.org/manage/account/publishing/
#   PyPI project name : ragi
#   GitHub owner      : hedypamungkas
#   Repository        : ragi
#   Workflow filename : release.yml
#   Environment       : pypi
# A "pending publisher" works for a project that does not exist yet -- the first
# release creates it. Until that publisher is registered, the publish job 403s,
# which is expected on the first tag before the link is in place.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing -- no API token stored.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
