# Hybrid (BM25 + semantic RRF) + Jina rerank -- the full stack. Needs an EmbeddingClient
# (programmatic) + JINA_API_KEY. Use as a library; not CLI-wired in v0.2.
enabled: true
chunker: paragraph
retriever: hybrid
top_k: 10
rrf_k: 60
semantic_weight: 1.0
keyword_weight: 1.0
rerank:
  provider: jina
  model: jina-reranker-v3
  fetch_multiplier: 4
documents:
  - path: data/ir_corpus
